version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: ckdt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: urticaria_monitoring
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./urticaria_db.sql:/docker-entrypoint-initdb.d/urticaria_db.sql:ro
volumes:
  mysql-data:
